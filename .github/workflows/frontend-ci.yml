name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      # --- Backend: real API, seeded data, no mocking ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Seed reference dataset
        working-directory: backend
        run: python seed.py
        env:
          JWT_SECRET_KEY: e2e-test-secret-key
          ADMIN_EMAIL: admin@mediflow.ai
          ADMIN_PASSWORD: TestPass123!

      - name: Start backend
        working-directory: backend
        run: nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        env:
          JWT_SECRET_KEY: e2e-test-secret-key
          ADMIN_EMAIL: admin@mediflow.ai
          ADMIN_PASSWORD: TestPass123!
          CORS_ORIGINS: http://localhost:4173
          RATE_LIMIT_ENABLED: "false"

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "Backend never became healthy" && cat backend/backend.log && exit 1

      # --- Frontend: production build served statically, pointed at the real backend above ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend against the live backend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend preview server
        working-directory: frontend
        run: nohup npm run preview -- --port 4173 --host > preview.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/MediFlow-AI/ && exit 0
            sleep 1
          done
          echo "Frontend never came up" && cat frontend/preview.log && exit 1

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
