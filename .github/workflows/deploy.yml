name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install and Build 🔧
        env:
          # Set VITE_API_BASE_URL in repo Settings -> Secrets and variables
          # -> Actions -> Variables (as PROD_API_BASE_URL) to point the
          # deployed site at your backend. Falls back to the original
          # Railway demo URL if not configured.
          VITE_API_BASE_URL: ${{ vars.PROD_API_BASE_URL || 'https://mediflow-ai-production-2f71.up.railway.app/api' }}
        run: |
          cd frontend
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
