server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: let React Router / client-side routing handle
    # unknown paths instead of nginx 404-ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets (Vite fingerprints filenames).
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
