[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = [
    "E501",  # line length handled by formatter, not worth blocking on
    "B008",  # FastAPI's Depends()/Body()/Query() in argument defaults is the
             # framework's required, documented pattern for dependency
             # injection - this is a false positive here, not a real issue.
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
]
